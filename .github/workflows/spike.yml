name: spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run spike
        env:
          BAHAMUT_UID: ${{ secrets.BAHAMUT_UID }}
          BAHAMUT_PWD: ${{ secrets.BAHAMUT_PWD }}
          BAHAMUT_TOTP: ${{ secrets.BAHAMUT_TOTP }}
